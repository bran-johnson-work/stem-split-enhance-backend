[project]
name = "ai-audio-stem-api"
version = "0.1.0"
description = "AI Audio Stem Separation API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "python-multipart>=0.0.9,<0.1",
    "uvicorn[standard]>=0.30,<0.31",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.27,<0.29",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = ">=0.15,<0.16"
pytest = ">=8.0"
pytest-asyncio = ">=0.24"

[tool.ruff]
line-length = 100
# Auto-generated Alembic revisions follow Alembic's own formatting.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
